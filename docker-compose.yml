services:
  postgres:
    image: postgres:16-alpine
    container_name: jjobtub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jjobtub_dev
      POSTGRES_USER: jjobtub_app
      POSTGRES_PASSWORD: jjobtub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - jjobtub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjobtub_app -d jjobtub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jjobtub_postgres_data:
